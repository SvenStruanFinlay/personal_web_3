<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="description" content="Track gym workouts, daily habits and weight-loss progress. Works fully offline.">
  <title>FitTrack</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <header class="app-header">
    <h1 class="app-title" id="viewTitle">Today</h1>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main id="main">
    <section class="view" id="view-today" hidden></section>
    <section class="view" id="view-train" hidden></section>
    <section class="view" id="view-habits" hidden></section>
    <section class="view" id="view-weight" hidden></section>
  </main>

  <div class="rest-bar" id="restBar" hidden>
    <div class="rest-bar-fill" id="restBarFill"></div>
    <div class="rest-bar-content">
      <span class="rest-label">Rest</span>
      <span class="rest-time" id="restTime">1:30</span>
      <button class="rest-adjust" id="restMinus">−15</button>
      <button class="rest-adjust" id="restPlus">+15</button>
      <button class="rest-skip" id="restSkip">Skip</button>
    </div>
  </div>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-view="today" aria-label="Today">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>Today</span>
    </button>
    <button class="tab" data-view="train" aria-label="Train">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M4 8v8M17.5 6.5v11M20 8v8M6.5 12h11"/></svg>
      <span>Train</span>
    </button>
    <button class="tab" data-view="habits" aria-label="Habits">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M8.5 13.5l2.5 2.5 4.5-5"/></svg>
      <span>Habits</span>
    </button>
    <button class="tab" data-view="weight" aria-label="Weight">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-8 4 6 3.5-4.5L21 17"/><path d="M3 21h18"/></svg>
      <span>Weight</span>
    </button>
  </nav>

  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
